xt-anchor="middle">จากโค้ดของวันรายงาน</text><line x1="1213.0" y1="661.0" x2="1512.0" y2="661.0" stroke="#16726D" stroke-width="1" opacity="0.3"/><text x="1362.5" y="699.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#16726D" font-weight="700" text-anchor="middle">SDS 47 หน้า</text></svg>