<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><circle cx="-40" cy="980" r="330" fill="#F2F7F7"/><circle cx="1670" cy="940" r="200" fill="#F2F7F7"/><rect x="0.0" y="0.0" width="1600.0" height="118.0" fill="#16726D"/><text x="60.0" y="62.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="40" fill="#FFFFFF" font-weight="700" letter-spacing="1.4">FRONT-END</text><text x="60.0" y="96.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#FFFFFF" opacity="0.86">ผลงานที่ส่งมอบแล้ว — ฝั่ง Front-End</text><text x="1450.0" y="66.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#FFFFFF" text-anchor="end" opacity="0.8">หัวข้อที่</text><circle cx="1506" cy="59.0" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/><text x="1506.0" y="70.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text><line x1="60" y1="840" x2="1540" y2="840" stroke="#DCE7E5" stroke-width="1.5"/><text x="60.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#7E8F8D">ULMs รายงานความก้าวหน้าโครงการ ครั้งที่ 4</text><text x="1540.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#16726D" font-weight="700" text-anchor="end">08</text><circle cx="68.0" cy="171.0" r="4.5" fill="#16726D"/><text x="88.0" y="178.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ปุ่มส่งคำขอ เขียนลงฐานข้อมูลจริง </tspan><tspan>งานที่ค้างมาสองรอบ ทำได้แล้ว เรียก loan.create และรายงานผลรายชิ้น เมื่อบางชิ้นถูกปฏิเสธ ชุดทดสอบผ่านเบราว์เซอร์ ยืนยันการส่งคำขอ</tspan></text><text x="88.0" y="206.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan>อุปกรณ์สองชิ้นสำเร็จ</tspan></text><circle cx="68.0" cy="299.0" r="4.5" fill="#16726D"/><text x="88.0" y="306.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ยกเลิกคำขอ ทำได้แล้ว แต่หน้ารับของยังไม่ได้ </tspan><tspan>ปุ่มยกเลิกเรียก loan.cancel พร้อมกล่องยืนยัน ส่วนหน้ารับของเรียกคำสั่งสามตัว ที่ฝั่งเซิร์ฟเวอร์ไม่มี จึงผ่านการตรวจชนิดข้อมูล</tspan></text><text x="88.0" y="334.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan>แต่ใช้งานจริงไม่ได้ ข้อถดถอยที่รายงานครั้งที่ 3 แจ้งไว้ ไม่เกิดขึ้นอีก</tspan></text><circle cx="68.0" cy="427.0" r="4.5" fill="#16726D"/><text x="88.0" y="434.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">หน้าห้อง ปรับตามมติทีม </tspan><tspan>ช่องเวลาละ 30 นาที เริ่ม 07:00 และจัดกลุ่มตามอาคาร แทนชนิดห้อง</tspan></text><circle cx="68.0" cy="527.0" r="4.5" fill="#16726D"/><text x="88.0" y="534.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">คำแปลข้อความผิดพลาด 62 จาก 65 รหัส </tspan><tspan>รอบก่อน 60 จาก 63 ที่ขาดอยู่ 3 รหัส เป็นเรื่องการต่ออายุ และการตรวจสภาพ</tspan></text></svg>