<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><circle cx="-40" cy="980" r="330" fill="#F2F7F7"/><circle cx="1670" cy="940" r="200" fill="#F2F7F7"/><rect x="0.0" y="0.0" width="1600.0" height="118.0" fill="#16726D"/><text x="60.0" y="62.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="40" fill="#FFFFFF" font-weight="700" letter-spacing="1.4">CHECKPOINT REVIEW</text><text x="60.0" y="96.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#FFFFFF" opacity="0.86">ผลของจุดวัดที่รายงานครั้งที่ 4 ตั้งไว้</text><text x="1450.0" y="66.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#FFFFFF" text-anchor="end" opacity="0.8">หัวข้อที่</text><circle cx="1506" cy="59.0" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/><text x="1506.0" y="70.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text><line x1="60" y1="840" x2="1540" y2="840" stroke="#DCE7E5" stroke-width="1.5"/><text x="60.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#7E8F8D">ULMs รายงานความก้าวหน้าโครงการ ครั้งที่ 5</text><text x="1540.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#16726D" font-weight="700" text-anchor="end">05</text><text x="60.0" y="170.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#7E8F8D">รายงานครั้งที่ 4 ประกาศจุดวัดไว้ 4 ข้อ แยกเป็นข้อละหนึ่งงาน ตามข้อสังเกตของรอบนั้น รอบนี้ผ่าน 2 ไม่ผ่าน 2</text><rect x="60.0" y="194.0" width="1480.0" height="44.0" fill="#16726D" rx="8"/><text x="130.0" y="223.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">จุดวัด</text><text x="860.0" y="223.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">กำหนด</text><text x="980.0" y="223.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">สภาพจริง</text><text x="1366.0" y="223.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">ผล</text><rect x="60.0" y="238.0" width="1480.0" height="66.0" fill="#F2F7F7"/><circle cx="94" cy="271.0" r="15" fill="none" stroke="#16726D" stroke-width="2"/><text x="94.0" y="277.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16" fill="#16726D" font-weight="700" text-anchor="middle">1</text><text x="130.0" y="278.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">หน้าส่งมอบของเจ้าหน้าที่ ใช้งานได้จริง</text><text x="860.0" y="278.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">19 ก.ย.</text><text x="980.0" y="278.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ใช้งานได้จริง แต่เข้า main 21 ก.ย. ช้า 2 วัน</text><rect x="1350.0" y="251.0" width="190.0" height="40.0" fill="#16726D" rx="20"/><text x="1445.0" y="278.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">ผ่าน</text><circle cx="94" cy="345.0" r="15" fill="none" stroke="#16726D" stroke-width="2"/><text x="94.0" y="351.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16" fill="#16726D" font-weight="700" text-anchor="middle">2</text><text x="130.0" y="352.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">วงจรยืม–คืน เดินครบเส้นทาง ตั้งแต่ส่งคำขอ ถึงตรวจสภาพ</text><text x="860.0" y="352.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">21 ก.ย.</text><text x="980.0" y="339.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ยังครอบคลุมเฉพาะขั้นส่งคำขอ และกรณีของขั้นนั้น</text><text x="980.0" y="365.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ไม่ผ่านแล้ว 2 จาก 3</text><rect x="1350.0" y="325.0" width="190.0" height="40.0" fill="#F5EAE2" rx="20"/><text x="1445.0" y="352.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#AD4E0C" font-weight="700" text-anchor="middle">ไม่ผ่าน</text><rect x="60.0" y="386.0" width="1480.0" height="66.0" fill="#F2F7F7"/><circle cx="94" cy="419.0" r="15" fill="none" stroke="#16726D" stroke-width="2"/><text x="94.0" y="425.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16" fill="#16726D" font-weight="700" text-anchor="middle">3</text><text x="130.0" y="426.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">ระบบตรวจอัตโนมัติ เรียกชุดทดสอบเบราว์เซอร์ และขวางการรวมโค้ด</text><text x="860.0" y="426.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">21 ก.ย.</text><text x="980.0" y="426.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">CI ไม่ถูกแก้เลยตลอดรอบ และไม่มีขั้น lint</text><rect x="1350.0" y="399.0" width="190.0" height="40.0" fill="#F5EAE2" rx="20"/><text x="1445.0" y="426.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#AD4E0C" font-weight="700" text-anchor="middle">ไม่ผ่าน</text><circle cx="94" cy="493.0" r="15" fill="none" stroke="#16726D" stroke-width="2"/><text x="94.0" y="499.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16" fill="#16726D" font-weight="700" text-anchor="middle">4</text><text x="130.0" y="500.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">การจองห้องใช้งานได้ หน้าห้องเลิกใช้ข้อมูลจำลอง และไม่เหลือหน้าว่าง</text><text x="860.0" y="500.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">24 ก.ย.</text><text x="980.0" y="487.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">การจองห้องใช้งานได้ หน้าห้องทั้ง 3 หน้า</text><text x="980.0" y="513.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">อ่านจากเซิร์ฟเวอร์จริง และไม่เหลือหน้าว่างในระบบ</text><rect x="1350.0" y="473.0" width="190.0" height="40.0" fill="#16726D" rx="20"/><text x="1445.0" y="500.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">ผ่าน</text><rect x="60.0" y="560.0" width="725.0" height="264.0" fill="#ECF4F3" rx="14"/><text x="84.0" y="598.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#16726D" font-weight="700">ผลการทบทวน</text><circle cx="96" cy="630" r="12" fill="#16726D"/><text x="96.0" y="635.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="120.0" y="636.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ข้อที่ผ่าน เป็นงานพัฒนาความสามารถ ข้อที่ไม่ผ่านทั้งสองข้อ เป็นเรื่องการทดสอบ</text><circle cx="96" cy="667" r="12" fill="#16726D"/><text x="96.0" y="672.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="120.0" y="673.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ข้อ 2 กับข้อ 3 เกี่ยวพันกัน การที่ CI ไม่เรียกชุดเบราว์เซอร์ ทำให้ไม่มีใครรู้ว่าชุดของการส่งคำขอ</text><text x="120.0" y="698.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">เสียไปกลางรอบ</text><circle cx="96" cy="729" r="12" fill="#16726D"/><text x="96.0" y="734.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="120.0" y="735.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">กำหนดเสร็จเลื่อนเป็น 8 ต.ค. จึงดึงตะกร้าข้ามหน่วยงาน และการจองล่วงหน้า กลับเข้าขอบเขต</text><rect x="815.0" y="560.0" width="725.0" height="264.0" fill="#FFFFFF" rx="14" stroke="#16726D" stroke-width="1.6"/><text x="839.0" y="598.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#16726D" font-weight="700">จุดวัดถึง 8 ต.ค.</text><rect x="839.0" y="615.0" width="71.4" height="28.0" fill="#16726D" rx="14"/><text x="874.7" y="634.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">26 ก.ย.</text><text x="945.0" y="636.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ชุดทดสอบเบราว์เซอร์ ผ่านครบทั้ง 25 กรณี</text><rect x="839.0" y="650.0" width="71.4" height="28.0" fill="#16726D" rx="14"/><text x="874.7" y="669.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">27 ก.ย.</text><text x="945.0" y="671.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ระบบตรวจอัตโนมัติ เรียกชุดเบราว์เซอร์ และขวางการรวมโค้ด</text><rect x="839.0" y="685.0" width="71.4" height="28.0" fill="#16726D" rx="14"/><text x="874.7" y="704.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">29 ก.ย.</text><text x="945.0" y="706.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ปิดข้อบกพร่องหน้าจอ 9 ข้อ และกำกับสถานะกลับ</text><rect x="839.0" y="720.0" width="63.6" height="28.0" fill="#16726D" rx="14"/><text x="870.8" y="739.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">1 ต.ค.</text><text x="945.0" y="741.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ตะกร้าข้ามหน่วยงาน และเพดานจองล่วงหน้าฝั่งเซิร์ฟเวอร์</text><rect x="839.0" y="755.0" width="63.6" height="28.0" fill="#16726D" rx="14"/><text x="870.8" y="774.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">6 ต.ค.</text><text x="945.0" y="776.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ระบบขึ้นใช้งานจริง และเข้าถึงได้จากภายนอก</text><text x="839.0" y="806.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16" fill="#AD4E0C" font-weight="700">ถ้าจุดวัดข้อ 1 หรือ 2 ไม่ผ่าน จะตัดเวลาซ้อมนำเสนอ มาใช้แก้ชุดทดสอบก่อน</text></svg>