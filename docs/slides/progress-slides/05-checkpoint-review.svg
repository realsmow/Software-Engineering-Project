<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><circle cx="-40" cy="980" r="330" fill="#F2F7F7"/><circle cx="1670" cy="940" r="200" fill="#F2F7F7"/><rect x="0.0" y="0.0" width="1600.0" height="118.0" fill="#16726D"/><text x="60.0" y="62.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="40" fill="#FFFFFF" font-weight="700" letter-spacing="1.4">CHECKPOINT REVIEW</text><text x="60.0" y="96.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#FFFFFF" opacity="0.86">ผลของจุดวัดที่รายงานครั้งที่ 3 ตั้งไว้</text><text x="1450.0" y="66.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#FFFFFF" text-anchor="end" opacity="0.8">หัวข้อที่</text><circle cx="1506" cy="59.0" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/><text x="1506.0" y="70.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text><line x1="60" y1="840" x2="1540" y2="840" stroke="#DCE7E5" stroke-width="1.5"/><text x="60.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#7E8F8D">ULMs รายงานความก้าวหน้าโครงการ ครั้งที่ 4</text><text x="1540.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#16726D" font-weight="700" text-anchor="end">05</text><text x="60.0" y="170.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#7E8F8D">รายงานครั้งที่ 3 ประกาศจุดวัดไว้ 4 ข้อ และระบุว่าถ้าข้อ 1 หรือ 2 ไม่ผ่าน จะตัดตะกร้าข้ามหน่วยงาน และการจองล่วงหน้า ออกจาก Sprint 4 ทันที</text><rect x="60.0" y="194.0" width="1480.0" height="44.0" fill="#16726D" rx="8"/><text x="130.0" y="223.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">จุดวัด</text><text x="860.0" y="223.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">กำหนด</text><text x="980.0" y="223.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">สภาพจริง</text><text x="1366.0" y="223.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">ผล</text><rect x="60.0" y="238.0" width="1480.0" height="82.0" fill="#F2F7F7"/><circle cx="94" cy="279.0" r="15" fill="none" stroke="#16726D" stroke-width="2"/><text x="94.0" y="285.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16" fill="#16726D" font-weight="700" text-anchor="middle">1</text><text x="130.0" y="286.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">ผู้ยืมส่งคำขอผ่านหน้าจอ ลงฐานข้อมูลจริง และหน้าส่งมอบใช้งานได้</text><text x="860.0" y="286.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">12 ก.ย.</text><text x="980.0" y="273.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ส่งคำขอทำได้แล้ว แต่ช้ากว่ากำหนด 2 ถึง 4 วัน</text><text x="980.0" y="299.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ส่วนหน้าส่งมอบ ยังเป็นหน้าว่าง</text><rect x="1350.0" y="259.0" width="190.0" height="40.0" fill="#F5EAE2" rx="20"/><text x="1445.0" y="286.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#AD4E0C" font-weight="700" text-anchor="middle">ไม่ผ่าน</text><circle cx="94" cy="374.0" r="15" fill="none" stroke="#16726D" stroke-width="2"/><text x="94.0" y="380.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16" fill="#16726D" font-weight="700" text-anchor="middle">2</text><text x="130.0" y="381.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">วงจรยืม–คืน เดินผ่านหน้าจอจริง และมีชุดทดสอบ ในระบบตรวจอัตโนมัติ</text><text x="860.0" y="381.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">14 ก.ย.</text><text x="980.0" y="355.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ชุดทดสอบเข้ามา 17 ก.ย.</text><text x="980.0" y="381.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">แต่ครอบคลุมเฉพาะขั้นส่งคำขอ</text><text x="980.0" y="407.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">และยังไม่ถูกเรียกอัตโนมัติ</text><rect x="1350.0" y="354.0" width="190.0" height="40.0" fill="#F5EAE2" rx="20"/><text x="1445.0" y="381.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#AD4E0C" font-weight="700" text-anchor="middle">ไม่ผ่าน</text><rect x="60.0" y="428.0" width="1480.0" height="66.0" fill="#F2F7F7"/><circle cx="94" cy="461.0" r="15" fill="none" stroke="#16726D" stroke-width="2"/><text x="94.0" y="467.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16" fill="#16726D" font-weight="700" text-anchor="middle">3</text><text x="130.0" y="468.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">ฝั่ง Front-End ใช้ไฟล์สัญญา ที่สร้างจากโค้ด</text><text x="860.0" y="468.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">14 ก.ย.</text><text x="980.0" y="468.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">รวมสัญญาไว้ที่ไฟล์เดียวแล้ว แต่ยังเขียนด้วยมือ</text><rect x="1350.0" y="441.0" width="190.0" height="40.0" fill="#F5EAE2" rx="20"/><text x="1445.0" y="468.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#AD4E0C" font-weight="700" text-anchor="middle">ไม่ผ่าน</text><circle cx="94" cy="535.0" r="15" fill="none" stroke="#16726D" stroke-width="2"/><text x="94.0" y="541.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16" fill="#16726D" font-weight="700" text-anchor="middle">4</text><text x="130.0" y="542.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">ไม่เหลือข้อมูลจำลอง และหน้าว่างในระบบ</text><text x="860.0" y="542.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">24 ก.ย.</text><text x="980.0" y="529.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">เหลือหน้าว่าง 2 หน้า และอีก 5 หน้า ยังไม่มี</text><text x="980.0" y="555.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">Back-End รองรับ</text><rect x="1350.0" y="515.0" width="190.0" height="40.0" fill="#ECEEEE" rx="20"/><text x="1445.0" y="542.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#13211F" font-weight="700" text-anchor="middle">ยังไม่ถึงกำหนด</text><rect x="60.0" y="602.0" width="725.0" height="222.0" fill="#ECF4F3" rx="14"/><text x="84.0" y="640.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#16726D" font-weight="700">ผลการทบทวน</text><circle cx="96" cy="672" r="12" fill="#16726D"/><text x="96.0" y="677.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="120.0" y="678.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">เรียกใช้แผนสำรอง ตัดตะกร้าข้ามหน่วยงาน และการจองล่วงหน้า ออกจาก Sprint 4</text><circle cx="96" cy="709" r="12" fill="#16726D"/><text x="96.0" y="714.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="120.0" y="715.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">คงการอุทธรณ์ และการจองห้องไว้ เพราะมีรหัสความต้องการใน SRS</text><circle cx="96" cy="746" r="12" fill="#16726D"/><text x="96.0" y="751.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="120.0" y="752.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">จุดวัดรอบถัดไป แยกเป็นข้อละหนึ่งงาน เพราะรอบนี้รวมสองงาน ไว้ในข้อเดียว</text><rect x="815.0" y="602.0" width="725.0" height="222.0" fill="#FFFFFF" rx="14" stroke="#16726D" stroke-width="1.6"/><text x="839.0" y="640.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#16726D" font-weight="700">จุดวัดของ Sprint 4</text><rect x="839.0" y="657.0" width="71.4" height="28.0" fill="#16726D" rx="14"/><text x="874.7" y="676.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">19 ก.ย.</text><text x="945.0" y="678.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">หน้าส่งมอบของเจ้าหน้าที่ ใช้งานได้จริง</text><rect x="839.0" y="692.0" width="71.4" height="28.0" fill="#16726D" rx="14"/><text x="874.7" y="711.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">21 ก.ย.</text><text x="945.0" y="713.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">วงจรยืม–คืน เดินครบเส้นทาง ผ่านหน้าจอ</text><rect x="839.0" y="727.0" width="71.4" height="28.0" fill="#16726D" rx="14"/><text x="874.7" y="746.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">21 ก.ย.</text><text x="945.0" y="748.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ระบบตรวจอัตโนมัติ เรียกชุดทดสอบเบราว์เซอร์</text><rect x="839.0" y="762.0" width="71.4" height="28.0" fill="#16726D" rx="14"/><text x="874.7" y="781.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">24 ก.ย.</text><text x="945.0" y="783.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">การจองห้องใช้งานได้ และไม่เหลือหน้าว่าง</text><text x="839.0" y="806.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16" fill="#AD4E0C" font-weight="700">ถ้าจุดวัดข้อ 1 หรือ 2 ไม่ผ่านอีก จะตัดการอุทธรณ์ ออกจากขอบเขตที่ส่งมอบ</text></svg>