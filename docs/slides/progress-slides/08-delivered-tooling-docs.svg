<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><circle cx="-40" cy="980" r="330" fill="#F2F7F7"/><circle cx="1670" cy="940" r="200" fill="#F2F7F7"/><rect x="0.0" y="0.0" width="1600.0" height="118.0" fill="#16726D"/><text x="60.0" y="62.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="40" fill="#FFFFFF" font-weight="700" letter-spacing="1.4">TOOLING &amp; DOCS</text><text x="60.0" y="96.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#FFFFFF" opacity="0.86">ผลงานที่ส่งมอบแล้ว — เครื่องมือ กระบวนการ และเอกสาร</text><text x="1450.0" y="66.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#FFFFFF" text-anchor="end" opacity="0.8">หัวข้อที่</text><circle cx="1506" cy="59.0" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/><text x="1506.0" y="70.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text><line x1="60" y1="840" x2="1540" y2="840" stroke="#DCE7E5" stroke-width="1.5"/><text x="60.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#7E8F8D">ULMs รายงานความก้าวหน้าโครงการ ครั้งที่ 1</text><text x="1540.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#16726D" font-weight="700" text-anchor="end">08</text><rect x="60.0" y="148.0" width="720.0" height="60.0" fill="#16726D" rx="10"/><text x="84.0" y="188.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="23" fill="#FFFFFF" font-weight="700">เครื่องมือและกระบวนการ</text><circle cx="68.0" cy="245.0" r="4" fill="#16726D"/><text x="86.0" y="252.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ระบบตรวจสอบอัตโนมัติ </tspan><tspan>ทำงานทั้งบนคำขอรวมโค้ด และการนำโค้ดเข้าสายหลัก</tspan></text><circle cx="68.0" cy="319.0" r="4" fill="#16726D"/><text x="86.0" y="326.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">สิ่งที่ตรวจ </tspan><tspan>ความสอดคล้องของเวอร์ชันไลบรารีร่วม แล้วตรวจการติดตั้ง ชนิดข้อมูล</tspan></text><text x="86.0" y="356.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>และการ Build ของทั้งสองฝั่ง</tspan></text><circle cx="68.0" cy="423.0" r="4" fill="#16726D"/><text x="86.0" y="430.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">สถานะ </tspan><tspan>อยู่บนสายหลักแล้ว และการตรวจล่าสุดผ่าน</tspan></text><circle cx="68.0" cy="497.0" r="4" fill="#16726D"/><text x="86.0" y="504.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ข้อจำกัดที่เหลือ </tspan><tspan>งานตรวจความสอดคล้องของเวอร์ชัน ยังตั้งไว้ให้รายงานผล</tspan></text><text x="86.0" y="534.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>โดยไม่ขวางการรวมโค้ด ทั้งที่ทั้งสองฝั่งตรงรุ่นกันแล้ว และระบบตรวจสอบอัตโนมัติ</tspan></text><text x="86.0" y="564.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>ยังไม่ได้เรียกชุดทดสอบที่มีอยู่ ให้ทำงาน</tspan></text><rect x="820.0" y="148.0" width="720.0" height="60.0" fill="#16726D" rx="10"/><text x="844.0" y="188.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="23" fill="#FFFFFF" font-weight="700">เอกสารและการออกแบบ</text><circle cx="828.0" cy="245.0" r="4" fill="#16726D"/><text x="846.0" y="252.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ข้อเสนอโครงการฉบับสมบูรณ์ </tspan><tspan>และการออกแบบฐานข้อมูล</tspan></text><text x="846.0" y="282.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>พร้อมพจนานุกรมข้อมูลครบทุกตาราง</tspan></text><circle cx="828.0" cy="349.0" r="4" fill="#16726D"/><text x="846.0" y="356.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">เอกสารประกอบการตัดสินใจ เรื่องสัญญา API </tspan><tspan>คู่มือหลักการ</tspan></text><text x="846.0" y="386.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>วาระประชุมพร้อมโค้ดตัวอย่าง และแบบฟอร์มลงมติ</tspan></text><circle cx="828.0" cy="453.0" r="4" fill="#16726D"/><text x="846.0" y="460.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">รายงานผลการทดลองสถาปัตยกรรม </tspan><tspan>ระบุจุดที่ต้องแก้ เพื่อให้ทั้งสองฝั่งเชื่อมต่อกันได้</tspan></text><text x="846.0" y="490.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>19 จุด เรียงตามความรุนแรง</tspan></text><circle cx="828.0" cy="557.0" r="4" fill="#16726D"/><text x="846.0" y="564.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">เอกสารส่งมอบสัญญา ให้ทีม Front-End </tspan><tspan>ระบุสิ่งที่ต้องแก้ ลำดับการแก้</tspan></text><text x="846.0" y="594.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>และผลกระทบต่องานที่ทำอยู่</tspan></text></svg>