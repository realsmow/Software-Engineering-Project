<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><circle cx="-40" cy="980" r="330" fill="#F2F7F7"/><circle cx="1670" cy="940" r="200" fill="#F2F7F7"/><rect x="0.0" y="0.0" width="1600.0" height="118.0" fill="#16726D"/><text x="60.0" y="62.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="40" fill="#FFFFFF" font-weight="700" letter-spacing="1.4">TOOLING &amp; DOCS</text><text x="60.0" y="96.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#FFFFFF" opacity="0.86">ผลงานที่ส่งมอบแล้ว — เครื่องมือ กระบวนการ และเอกสาร</text><text x="1450.0" y="66.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#FFFFFF" text-anchor="end" opacity="0.8">หัวข้อที่</text><circle cx="1506" cy="59.0" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/><text x="1506.0" y="70.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text><line x1="60" y1="840" x2="1540" y2="840" stroke="#DCE7E5" stroke-width="1.5"/><text x="60.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#7E8F8D">ULMs รายงานความก้าวหน้าโครงการ ครั้งที่ 4</text><text x="1540.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#16726D" font-weight="700" text-anchor="end">09</text><rect x="60.0" y="148.0" width="720.0" height="60.0" fill="#16726D" rx="10"/><text x="84.0" y="188.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="23" fill="#FFFFFF" font-weight="700">เครื่องมือและกระบวนการ</text><circle cx="68.0" cy="245.0" r="4" fill="#16726D"/><text x="86.0" y="252.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ชุดทดสอบผ่านเบราว์เซอร์ ของการส่งคำขอ </tspan><tspan>มีเป็นครั้งแรก รวมเป็น 13 กรณี ใน 4</tspan></text><text x="86.0" y="282.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>ไฟล์ ครอบคลุมผู้ดูแลระบบ รายการอุปกรณ์ และการส่งคำขอยืม</tspan></text><circle cx="68.0" cy="349.0" r="4" fill="#16726D"/><text x="86.0" y="356.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">รายการความพร้อมของการทดสอบ </tspan><tspan>คณะทำงานจัดทำไว้ในระบบจัดเก็บโค้ด</tspan></text><text x="86.0" y="386.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>ครอบคลุมทั้ง 12 โมดูล แยกสถานะฝั่ง Back-End ฝั่ง Front-End และการต่อเชื่อม</tspan></text><circle cx="68.0" cy="453.0" r="4" fill="#16726D"/><text x="86.0" y="460.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ล้างสำเนารีโป ที่ commit ซ้อนเข้ามา </tspan><tspan>พร้อมเพิ่มกติกา ไม่ให้เกิดซ้ำ</tspan></text><circle cx="68.0" cy="527.0" r="4" fill="#16726D"/><text x="86.0" y="534.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ข้อจำกัดที่เหลือ </tspan><tspan>ระบบตรวจอัตโนมัติ ยังไม่เรียกชุดทดสอบผ่านเบราว์เซอร์เลย</tspan></text><text x="86.0" y="564.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>และชุดตรวจเกณฑ์การยอมรับ 49 ข้อ ยังต้องสั่งรันเอง</tspan></text><rect x="820.0" y="148.0" width="720.0" height="60.0" fill="#16726D" rx="10"/><text x="844.0" y="188.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="23" fill="#FFFFFF" font-weight="700">เอกสารและการออกแบบ</text><circle cx="828.0" cy="245.0" r="4" fill="#16726D"/><text x="846.0" y="252.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">SDS ฉบับ 1.2 </tspan><tspan>นับทุกคอลัมน์สถานะใหม่ จากโค้ดของวันรายงาน</tspan></text><text x="846.0" y="282.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>เพิ่มเรื่องชนิดเวลาที่เก็บเขตเวลา และสถานะชุดทดสอบ</tspan></text><circle cx="828.0" cy="349.0" r="4" fill="#16726D"/><text x="846.0" y="356.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">แก้ข้อที่เขียนตามโค้ด แทนที่จะเขียนตามแผน </tspan><tspan>เรื่องการระงับสิทธิ์การยืม</tspan></text><text x="846.0" y="386.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>ซึ่งแผนกำหนดให้บทลงโทษ มีผลผ่านระดับเครดิตเท่านั้น ส่วนฟังก์ชันที่มีอยู่ในโค้ด</tspan></text><text x="846.0" y="416.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>กำกับไว้ว่าอยู่นอกขอบเขตแผน</tspan></text><circle cx="828.0" cy="483.0" r="4" fill="#16726D"/><text x="846.0" y="490.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">รายงานผลตรวจความสอดคล้องทั้งเว็บ </tspan><tspan>พร้อมฉบับย่อ สำหรับให้ทีมอ่านเร็ว</tspan></text></svg>