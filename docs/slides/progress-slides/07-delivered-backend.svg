<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><circle cx="-40" cy="980" r="330" fill="#F2F7F7"/><circle cx="1670" cy="940" r="200" fill="#F2F7F7"/><rect x="0.0" y="0.0" width="1600.0" height="118.0" fill="#16726D"/><text x="60.0" y="62.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="40" fill="#FFFFFF" font-weight="700" letter-spacing="1.4">BACK-END</text><text x="60.0" y="96.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#FFFFFF" opacity="0.86">ผลงานที่ส่งมอบแล้ว — ฝั่ง Back-End</text><text x="1450.0" y="66.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#FFFFFF" text-anchor="end" opacity="0.8">หัวข้อที่</text><circle cx="1506" cy="59.0" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/><text x="1506.0" y="70.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text><line x1="60" y1="840" x2="1540" y2="840" stroke="#DCE7E5" stroke-width="1.5"/><text x="60.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#7E8F8D">ULMs รายงานความก้าวหน้าโครงการ ครั้งที่ 4</text><text x="1540.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#16726D" font-weight="700" text-anchor="end">07</text><circle cx="68.0" cy="171.0" r="4.5" fill="#16726D"/><text x="88.0" y="178.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ความถูกต้องของเวลา </tspan><tspan>คอลัมน์เวลาทุกคอลัมน์ในฐานข้อมูล เปลี่ยนเป็นชนิดที่เก็บเขตเวลาไว้ด้วย ค่าเวลาที่บันทึกจากเครื่องคนละเขตเวลา จึงเทียบกันได้ตรง และกำหนดคืน</tspan></text><text x="88.0" y="206.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan>ไม่เลื่อนตามเขตเวลาของผู้ใช้</tspan></text><circle cx="68.0" cy="299.0" r="4.5" fill="#16726D"/><text x="88.0" y="306.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">กันหน่วยงานไม่เหลือผู้ดูแล </tspan><tspan>เดิมเปลี่ยนบทบาท หรือปิดบัญชีคนสุดท้ายของหน่วยงานได้ โดยระบบไม่เตือน ทำให้คิวอนุมัติ การจ่ายของ และการตรวจสภาพ ของหน่วยงานนั้น ไม่มีเจ้าของ</tspan></text><text x="88.0" y="334.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan>ตอนนี้ระบบขวางไว้แล้ว</tspan></text><circle cx="68.0" cy="427.0" r="4.5" fill="#16726D"/><text x="88.0" y="434.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ชุดทดสอบของการจัดการผู้ใช้ และการจัดการอุปกรณ์ </tspan><tspan>เขียนใหม่ทั้งสองชุด พร้อมไฟล์ตั้งค่าแยก สำหรับสั่งรันเฉพาะกลุ่ม</tspan></text><circle cx="68.0" cy="527.0" r="4.5" fill="#16726D"/><text x="88.0" y="534.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ความสามารถใหม่ หยุดนิ่งทั้งรอบ </tspan><tspan>จำนวนคำสั่งบน main เท่ารอบก่อนทุกตัว ตรวจซ้ำด้วยการนับ ทั้งที่โค้ดของรอบก่อน และของรอบนี้ ได้ 86 เท่ากัน</tspan></text><circle cx="68.0" cy="627.0" r="4.5" fill="#16726D"/><text x="88.0" y="634.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ขนาดของสิ่งที่ส่งมอบ </tspan><tspan>10 กลุ่มงาน รวม 86 คำสั่ง บนฐานข้อมูล 30 ตาราง 9 Enum และ 10 Migration</tspan></text></svg>