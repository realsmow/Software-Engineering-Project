aksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">แถบความคืบหน้าไม่ตรงกับป้ายสถานะ</text><circle cx="92.0" cy="500.0" r="3.5" fill="#AD4E0C"/><text x="108.0" y="506.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ใบจองห้องไม่มีรหัสครุภัณฑ์</text><circle cx="92.0" cy="526.0" r="3.5" fill="#AD4E0C"/><text x="108.0" y="532.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">คอลัมน์ ว่างครั้งถัดไป เป็นขีดทุกแถว</text><circle cx="92.0" cy="552.0" r="3.5" fill="#AD4E0C"/><text x="108.0" y="558.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">หน้าคลังไม่มีปุ่มเพิ่มอุปกรณ์</text><circle cx="92.0" cy="578.0" r="3.5" fill="#AD4E0C"/><text x="108.0" y="584.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">แถบนำทางหน้าส่งมอบไม่ตรงหัวข้อ</text><circle cx="92.0" cy="604.0" r="3.5" fill="#AD4E0C"/><text x="108.0" y="610.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ตารางโทษไม่แยกหักเครดิตกับระงับสิทธิ์</text><circle cx="92.0" cy="630.0" r="3.5" fill="#AD4E0C"/><text x="108.0" y="636.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">แถบแจ้งเตือนอ้างห้องที่ไม่อยู่ในตาราง</text><rect x="815.0" y="354.0" width="725.0" height="424.0" fill="#ECF4F3" rx="14"/><text x="839.0" y="392.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#16726D" font-weight="700">หักจากมิติไหน</text><text x="1390.0" y="422.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#7E8F8D" text-anchor="middle">นับล้วน</text><text x="1500.0" y="422.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#7E8F8D" text-anchor="middle">หลังหัก</text><text x="839.0" y="450.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">Back-End Design</text><text x="1390.0" y="450.0" font-family="Laksaman, Noto San