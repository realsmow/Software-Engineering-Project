<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><circle cx="-40" cy="980" r="330" fill="#F2F7F7"/><circle cx="1670" cy="940" r="200" fill="#F2F7F7"/><rect x="0.0" y="0.0" width="1600.0" height="118.0" fill="#16726D"/><text x="60.0" y="62.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="40" fill="#FFFFFF" font-weight="700" letter-spacing="1.4">BACK-END</text><text x="60.0" y="96.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#FFFFFF" opacity="0.86">ผลงานที่ส่งมอบแล้ว — ฝั่ง Back-End</text><text x="1450.0" y="66.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#FFFFFF" text-anchor="end" opacity="0.8">หัวข้อที่</text><circle cx="1506" cy="59.0" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/><text x="1506.0" y="70.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text><line x1="60" y1="840" x2="1540" y2="840" stroke="#DCE7E5" stroke-width="1.5"/><text x="60.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#7E8F8D">ULMs รายงานความก้าวหน้าโครงการ ครั้งที่ 5</text><text x="1540.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#16726D" font-weight="700" text-anchor="end">08</text><circle cx="68.0" cy="171.0" r="4.5" fill="#16726D"/><text x="88.0" y="178.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">การอุทธรณ์ มีโค้ดแล้ว </tspan><tspan>เป็นกลุ่มงานที่ 11 มี 6 คำสั่ง ยื่นได้จากบทลงโทษจริง ผู้พิจารณาตัดสินแล้วมีผลกับเครดิต และห้ามตัดสินเรื่องของตนเอง รายงานสามฉบับก่อนหน้า</tspan></text><text x="88.0" y="206.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan>ระบุตรงกันว่าเรื่องนี้ยังไม่มีโค้ดเลย</tspan></text><circle cx="68.0" cy="299.0" r="4.5" fill="#16726D"/><text x="88.0" y="306.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">การจองห้อง ใช้งานได้ </tspan><tspan>อ่านช่วงเวลาว่าง และจองได้จริง โดยบังคับกฎสล็อตเวลา เพดาน 3 ชั่วโมง และกฎวันเดียวกัน ที่ฝั่งเซิร์ฟเวอร์ทุกเส้นทาง</tspan></text><circle cx="68.0" cy="399.0" r="4.5" fill="#16726D"/><text x="88.0" y="406.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">สมัครสมาชิกเอง พร้อมยืนยันอีเมล </tspan><tspan>บัญชีที่สมัครใหม่ ยังไม่เปิดใช้จนกว่าจะกดลิงก์ยืนยัน คำตอบไม่บอกว่าอีเมลนั้นมีอยู่แล้วหรือไม่ จึงใช้ค้นหาคนไม่ได้ และมีการขอตั้งรหัสผ่านใหม่ด้วย</tspan></text><circle cx="68.0" cy="499.0" r="4.5" fill="#16726D"/><text x="88.0" y="506.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">งานตามเวลา ทำงานจริงครบ </tspan><tspan>เหลือ 6 งานและทำงานได้ทั้งหมด computeAvailability กับ rollupDailyStats ถูกถอดออกโดยตั้งใจ เพราะของคงเหลือคำนวณสดอยู่แล้ว</tspan></text><circle cx="68.0" cy="599.0" r="4.5" fill="#16726D"/><text x="88.0" y="606.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ขนาดของสิ่งที่ส่งมอบ </tspan><tspan>11 กลุ่มงาน รวม 102 คำสั่ง บนฐานข้อมูล 33 ตาราง 9 Enum และ 15 Migration</tspan></text></svg>