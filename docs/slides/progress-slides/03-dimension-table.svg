" fill="#7E8F8D">UI/UX + Business Process</text><text x="470.0" y="327.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#7E8F8D" text-anchor="middle">10%</text><text x="560.0" y="327.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#7E8F8D" text-anchor="middle">96</text><text x="645.0" y="327.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#16726D" font-weight="700" text-anchor="middle">96</text><text x="740.0" y="327.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#7E8F8D" font-weight="700" text-anchor="middle">0</text><text x="820.0" y="314.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">หน้าจอที่มีเนื้อหาจริง 27 จาก 29 หน้า หน้าห้องปรับเป็นช่องละ 30 นาที และจัดกลุ่มตามอาคาร</text><text x="820.0" y="339.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">เหลือหน้าว่าง 2 หน้า คือส่งมอบของ และส่งออกรายงาน</text><rect x="60.0" y="360.0" width="1480.0" height="78.0" fill="#F2F7F7"/><text x="78.0" y="398.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">Back-End Dev</text><text x="470.0" y="405.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#7E8F8D" text-anchor="middle">30%</text><text x="560.0" y="405.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#7E8F8D" text-anchor="middle">88</text><text x="645.0" y="405.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#16726D" font-weight="700" text-anchor="middle">79</text><text x="740.0" y="405.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#AD4E0C" font-weight="700" text-anchor="middle">-9</text><text x="820.0" y="392.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">จำนวนคำสั่งบน main เท่ารอบก่อนทุกตัว งานรอบนี้เป็นการแก้ความถูกต้อง ของการคำนวณเวลา</text><text x="820.0" y="417.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">และกันการลดบทบาท จนหน่วยงานไม่เหลือผู้ดูแล ยังเหลือการอุทธรณ์ ที่ยังไม่มีโค้ดเลย</text><text x="78.0" y="476.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">Front-End Dev</text><text x="470.0" y="483.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#7E8F8D" text-anchor="middle">25%</text><text x="560.0" y="483.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#7E8F8D" text-anchor="middle">88</text><text x="645.0" y="483.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#16726D" font-weight="700" text-anchor="middle">80</text><text x="740.0" y="483.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#AD4E0C" font-weight="700" text-anchor="middle">-8</text><text x="820.0" y="470.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ปุ่มส่งคำขอ และปุ่มยกเลิก เรียก Back-End ได้แล้ว ซึ่งเป็นงานที่ค้างมาสองรอบ ส่วนหน้ารับของ</text><text x="820.0" y="495.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">เรียกคำสั่งที่เซิร์ฟเวอร์ไม่มี จึงยังใช้งานไม่ได้ เหลือปุ่มขอต่ออายุ และหน้าห้องกับหน้าอุทธรณ์ 5 หน้า</text><rect x="60.0" y="516.0" width="1480.0" height="78.0" fill="#F2F7F7"/><text x="78.0" y="546.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">Test</text><text x="78.0" y="567.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="14.5" fill="#7E8F8D">Front-End + Back-End</text><text x="470.0" y="561.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#7E8F8D" text-anchor="middle">15%</text><text x="560.0" y="561.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#7E8F8D" text-anchor="middle">66</text><text x="645.0" y="561.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#16726D" font-weight="700" text-anchor="middle">47</text><text x="740.0" y="561.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#AD4E0C" font-weight="700" text-anchor="middle">-19</text><text x="820.0" y="548.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">ชุดทดสอบฝั่ง Back-End เพิ่มจาก 234 เป็น 266 กรณี ชุดทดสอบผ่านเบราว์เซอร์ เพิ่มจาก 11 เป็น 13</text><text x="820.0" y="573.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">กรณี แต่ระบบตรวจอัตโนมัติ ยังไม่เรียกชุดผ่านเบราว์เซอร์เลย</text><text x="78.0" y="632.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">Documentation</text><text x="470.0" y="639.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#7E8F8D" text-anchor="middle">10%</text><text x="560.0" y="639.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#7E8F8D" text-anchor="middle">82</text><text x="645.0" y="639.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#16726D" font-weight="700" text-anchor="middle">85</text><text x="740.0" y="639.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#16726D" font-weight="700" text-anchor="middle">+3</text><text x="820.0" y="626.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">SDS ฉบับ 1.2 นับใหม่จากโค้ดของวันรายงาน แก้ข้อที่เคยเขียนตามโค้ด เรื่องการระงับสิทธิ์การยืม</text><text x="820.0" y="651.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17" fill="#13211F">และเพิ่มรายงานผลตรวจ ความสอดคล้องทั้งเว็บ ซึ่งข้อเสนอแก้ SRS ยังรอการตัดสิน</text><rect x="60.0" y="672.0" width="1480.0" height="52.0" fill="#DEEBEB" rx="8"/><text x="78.0" y="706.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#13211F" font-weight="700">รวมถ่วงน้ำหนัก</text><text x="470.0" y="706.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#13211F" font-weight="700" text-anchor="middle">100%</text><text x="560.0" y="706.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#13211F" font-weight="700" text-anchor="middle">86</text><text x="645.0" y="706.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#16726D" font-weight="700" text-anchor="middle">79</text><text x="740.0" y="706.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#AD4E0C" font-weight="700" text-anchor="middle">-7</text><rect x="60.0" y="738.0" width="1480.0" height="88.0" fill="#FAF4F0" rx="10"/><rect x="60.0" y="738.0" width="5.0" height="88.0" fill="#AD4E0C" rx="2.5"/><text x="84.0" y="770.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#13211F" xml:space="preserve"><tspan font-weight="700">มิติที่ต้องเฝ้าระวัง — </tspan><tspan>Test ยังห่างจากแผนมากที่สุด ที่ 19 จุด แต่รอบนี้ขยับ 12 จุด มากที่สุดในบรรดาทุกมิติ ที่ยังห่าง เพราะค่าแผนของ Sprint 4 ขยับจาก 52 ไป 80 ภายใน Sprint เดียว</tspan></text><text x="84.0" y="797.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#13211F" xml:space="preserve"><tspan>มิติที่ถดถอยเชิงเปรียบเทียบคือ Back-End Dev จากห่าง 1 จุด เป็นห่าง 9 จุด เพราะจำนวนคำสั่งบน main เท่าเดิมทุกตัว ทั้งที่ค่าแผนขยับ 10 จุด</tspan></text></svg>