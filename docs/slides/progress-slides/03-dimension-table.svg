้ เขียนเสร็จหมดแล้ว</tspan></text><text x="84.0" y="739.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#13211F" xml:space="preserve"><tspan>และรออยู่บนสายงานแยก และ Test ที่ห่างจากแผนมากที่สุด 21 จุด เพราะระบบตรวจสอบอัตโนมัติ ยังไม่ได้เรียกชุดทดสอบที่มีอยู่ ให้ทำงาน</tspan></text></svg>