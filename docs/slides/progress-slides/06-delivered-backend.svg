<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><circle cx="-40" cy="980" r="330" fill="#F2F7F7"/><circle cx="1670" cy="940" r="200" fill="#F2F7F7"/><rect x="0.0" y="0.0" width="1600.0" height="118.0" fill="#16726D"/><text x="60.0" y="62.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="40" fill="#FFFFFF" font-weight="700" letter-spacing="1.4">BACK-END</text><text x="60.0" y="96.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#FFFFFF" opacity="0.86">ผลงานที่ส่งมอบแล้ว — ฝั่ง Back-End</text><text x="1450.0" y="66.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#FFFFFF" text-anchor="end" opacity="0.8">หัวข้อที่</text><circle cx="1506" cy="59.0" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/><text x="1506.0" y="70.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text><line x1="60" y1="840" x2="1540" y2="840" stroke="#DCE7E5" stroke-width="1.5"/><text x="60.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#7E8F8D">ULMs รายงานความก้าวหน้าโครงการ ครั้งที่ 1</text><text x="1540.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#16726D" font-weight="700" text-anchor="end">06</text><circle cx="68.0" cy="171.0" r="4.5" fill="#16726D"/><text x="88.0" y="178.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">โครงสร้างพื้นฐาน </tspan><tspan>NestJS 11 ประกอบกับ Prisma 7, nestjs-trpc และตัวเชื่อม PostgreSQL ตั้งค่า CORS แบบระบุ Origin เจาะจง พร้อมรองรับคุกกี้ยืนยันตัวตน</tspan></text><circle cx="68.0" cy="239.5" r="4.5" fill="#16726D"/><text x="88.0" y="246.5" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ฐานข้อมูล </tspan><tspan>27 ตาราง 9 Enum พร้อม Migration ที่สร้างตารางได้จริง ครอบคลุมอุปกรณ์ครบทั้งสี่ระดับ โดยตารางห้อง และตารางการจอง รองรับ T3 อยู่แล้ว</tspan></text><circle cx="68.0" cy="308.0" r="4.5" fill="#16726D"/><text x="88.0" y="315.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ระบบยืนยันตัวตนที่ใช้งานได้จริง </tspan><tspan>เข้าสู่ระบบด้วยอีเมลมหาวิทยาลัย หรือรหัสผู้ใช้ เก็บรหัสผ่านด้วย scrypt ออกคุกกี้เซสชันแบบ httpOnly ที่หน้าเว็บอ่านไม่ได้ ตรวจโทเคน</tspan></text><text x="88.0" y="343.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan>และอ่านบทบาทสด จากฐานข้อมูลทุกคำขอ พร้อมออกจากระบบ</tspan></text><circle cx="68.0" cy="404.5" r="4.5" fill="#16726D"/><text x="88.0" y="411.5" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ชั้นควบคุมสิทธิ์ </tspan><tspan>บังคับเข้าสู่ระบบก่อน และแยกสิทธิ์อีก 3 ระดับ คือเจ้าหน้าที่ ผู้อนุมัติ และผู้ดูแลระบบ แยกกรณียังไม่เข้าสู่ระบบ ออกจากกรณีเข้าสู่ระบบแล้ว แต่สิทธิ์ไม่พอ</tspan></text><circle cx="68.0" cy="473.0" r="4.5" fill="#16726D"/><text x="88.0" y="480.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ระบบผู้ดูแลระบบครบชุด </tspan><tspan>ค้นและแสดงบัญชีผู้ใช้แบบแบ่งหน้า สร้าง แก้ไข เปลี่ยนบทบาท ตั้งรหัสผ่านใหม่ ระงับและปลดระงับบัญชี อ่านและแก้ค่าตั้งของระบบการยืม</tspan></text><text x="88.0" y="508.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan>อ่านสถานะระบบและงานตามเวลา และค้นบันทึกการตรวจสอบ</tspan></text><circle cx="68.0" cy="569.5" r="4.5" fill="#16726D"/><text x="88.0" y="576.5" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">สคริปต์ข้อมูลตั้งต้น </tspan><tspan>สร้างระดับเครดิตให้ครอบคลุมคะแนน 0 ถึง 100 โดยไม่มีช่องว่าง และสร้างบัญชีผู้ใช้ครบทุกบทบาท เขียนให้เรียกซ้ำได้โดยไม่พัง</tspan></text><circle cx="68.0" cy="638.0" r="4.5" fill="#16726D"/><text x="88.0" y="645.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">สัญญา API เป็นไฟล์กลาง ที่สร้างจากโค้ดจริง </tspan><tspan>มีคำสั่งสร้างใหม่ และคำสั่งตรวจว่าไฟล์ยังตรงกับโค้ด ทำให้สัญญาไม่มีวันคลาด จากสิ่งที่ระบบทำจริง</tspan></text><circle cx="68.0" cy="706.5" r="4.5" fill="#16726D"/><text x="88.0" y="713.5" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ผลการทดสอบ </tspan><tspan>ชุดทดสอบบนสายหลัก 55 กรณี ครอบคลุมการอ่านและตรวจโทเคนเซสชัน การเข้ารหัสรหัสผ่าน การแปลงข้อมูลบัญชีผู้ใช้ และวงจรเข้าสู่ระบบ ในจำนวนนี้ 48 กรณี</tspan></text><text x="88.0" y="741.5" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan>ทำงานได้โดยไม่ต้องต่อฐานข้อมูล อีก 7 กรณี ต้องต่อ PostgreSQL จริง</tspan></text></svg>