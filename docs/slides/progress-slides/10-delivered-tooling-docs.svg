<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><circle cx="-40" cy="980" r="330" fill="#F2F7F7"/><circle cx="1670" cy="940" r="200" fill="#F2F7F7"/><rect x="0.0" y="0.0" width="1600.0" height="118.0" fill="#16726D"/><text x="60.0" y="62.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="40" fill="#FFFFFF" font-weight="700" letter-spacing="1.4">TOOLING &amp; DOCS</text><text x="60.0" y="96.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#FFFFFF" opacity="0.86">ผลงานที่ส่งมอบแล้ว — เครื่องมือ กระบวนการ และเอกสาร</text><text x="1450.0" y="66.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#FFFFFF" text-anchor="end" opacity="0.8">หัวข้อที่</text><circle cx="1506" cy="59.0" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/><text x="1506.0" y="70.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text><line x1="60" y1="840" x2="1540" y2="840" stroke="#DCE7E5" stroke-width="1.5"/><text x="60.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#7E8F8D">ULMs รายงานความก้าวหน้าโครงการ ครั้งที่ 5</text><text x="1540.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#16726D" font-weight="700" text-anchor="end">10</text><rect x="60.0" y="148.0" width="720.0" height="60.0" fill="#16726D" rx="10"/><text x="84.0" y="188.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="23" fill="#FFFFFF" font-weight="700">เครื่องมือและกระบวนการ</text><circle cx="68.0" cy="245.0" r="4" fill="#16726D"/><text x="86.0" y="252.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ชุดทดสอบเพิ่มขึ้นทุกชั้น </tspan><tspan>ฝั่งเซิร์ฟเวอร์จาก 266 เป็น 421 กรณี และจาก 24 เป็น 41</tspan></text><text x="86.0" y="282.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>ชุด ส่วนประกอบหน้าเว็บจาก 33 เป็น 105 กรณี และจาก 3 เป็น 17 ไฟล์</tspan></text><text x="86.0" y="312.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>ชุดผ่านเบราว์เซอร์จาก 13 เป็น 25 กรณี</tspan></text><circle cx="68.0" cy="379.0" r="4" fill="#16726D"/><text x="86.0" y="386.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">แต่ชุดผ่านเบราว์เซอร์ ไม่ผ่าน 5 กรณี </tspan><tspan>ทั้งห้ากรณีไม่ใช่ข้อผิดพลาดของเซิร์ฟเวอร์</tspan></text><text x="86.0" y="416.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>แต่เป็นชุดทดสอบ ที่ค้นหาองค์ประกอบด้วยชื่อเดิม</tspan></text><text x="86.0" y="446.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>ขณะที่หน้าจอถูกแก้โดยตั้งใจในรอบนี้</tspan></text><circle cx="68.0" cy="513.0" r="4" fill="#16726D"/><text x="86.0" y="520.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">สองในห้า คือชุดที่เพิ่งเพิ่มรอบก่อน </tspan><tspan>ชุดทดสอบการส่งคำขอยืม</tspan></text><text x="86.0" y="550.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>ที่เพิ่มเข้ามาเพื่อตอบจุดวัดของรายงานครั้งที่ 4 ผ่านตอนเข้า main วันที่ 17 ก.ย.</tspan></text><text x="86.0" y="580.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>และเสียไประหว่างรอบนี้ โดยไม่มีใครทราบ จนคณะทำงานรันเองในวันรายงาน</tspan></text><circle cx="68.0" cy="647.0" r="4" fill="#16726D"/><text x="86.0" y="654.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ต้นเหตุคือข้อจำกัดเดิม </tspan><tspan>ระบบตรวจอัตโนมัติ ยังไม่เรียกชุดทดสอบผ่านเบราว์เซอร์</tspan></text><text x="86.0" y="684.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>มาสามรอบแล้ว และไม่มีขั้นตอน lint จึงไม่จับข้อผิดพลาดรูปแบบโค้ด 5 ข้อที่มีอยู่</tspan></text><rect x="820.0" y="148.0" width="720.0" height="60.0" fill="#16726D" rx="10"/><text x="844.0" y="188.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="23" fill="#FFFFFF" font-weight="700">เอกสารและการออกแบบ</text><circle cx="828.0" cy="245.0" r="4" fill="#16726D"/><text x="846.0" y="252.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">SDS ฉบับ 1.3 </tspan><tspan>นับทุกคอลัมน์สถานะใหม่ จากโค้ดของวันรายงาน เพิ่มตารางใหม่ 3</tspan></text><text x="846.0" y="282.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>ตาราง คือการยืนยันอีเมล การตั้งรหัสผ่านใหม่ และรอบตรวจห้อง</tspan></text><circle cx="828.0" cy="349.0" r="4" fill="#16726D"/><text x="846.0" y="356.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">สถานะที่เปลี่ยนมากที่สุด </tspan><tspan>การอุทธรณ์ และการจองห้อง เปลี่ยนจาก ยังไม่มีฟังก์ชัน</tspan></text><text x="846.0" y="386.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>เป็นใช้งานได้จริง ส่วนความต่างของสัญญาสองฝั่ง เปลี่ยนจาก 14 รายการ เป็น 0</tspan></text><circle cx="828.0" cy="453.0" r="4" fill="#16726D"/><text x="846.0" y="460.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ข้อที่ยังคาไว้เหมือนเดิม </tspan><tspan>ไฟล์สัญญาฝั่งหน้าเว็บ ยังเขียนด้วยมือ ความตรงกันในวันนี้</tspan></text><text x="846.0" y="490.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="20" fill="#13211F" xml:space="preserve"><tspan>จึงมาจากการไล่แก้ ไม่ใช่จากกลไกที่กันไว้</tspan></text></svg>