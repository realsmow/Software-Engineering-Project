<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><circle cx="-40" cy="980" r="330" fill="#F2F7F7"/><circle cx="1670" cy="940" r="200" fill="#F2F7F7"/><rect x="0.0" y="0.0" width="1600.0" height="118.0" fill="#16726D"/><text x="60.0" y="62.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="40" fill="#FFFFFF" font-weight="700" letter-spacing="1.4">EVIDENCE LEVEL</text><text x="60.0" y="96.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#FFFFFF" opacity="0.86">ระดับหลักฐานของสิ่งที่รายงานว่าเสร็จ</text><text x="1450.0" y="66.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#FFFFFF" text-anchor="end" opacity="0.8">หัวข้อที่</text><circle cx="1506" cy="59.0" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/><text x="1506.0" y="70.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text><line x1="60" y1="840" x2="1540" y2="840" stroke="#DCE7E5" stroke-width="1.5"/><text x="60.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#7E8F8D">ULMs รายงานความก้าวหน้าโครงการ ครั้งที่ 4</text><text x="1540.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#16726D" font-weight="700" text-anchor="end">10</text><rect x="60.0" y="152.0" width="1480.0" height="44.0" fill="#16726D" rx="8"/><text x="78.0" y="181.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">สิ่งที่ส่งมอบ</text><text x="520.0" y="181.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">หลักฐาน ณ วันรายงาน</text><text x="1231.0" y="181.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">ระดับ</text><rect x="60.0" y="196.0" width="1480.0" height="66.0" fill="#F2F7F7"/><text x="78.0" y="236.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">สัญญา 86 คำสั่ง ใน 10 กลุ่มงาน</text><text x="520.0" y="236.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">ระบบเรียกใช้ได้ครบทุกคำสั่งตอนเริ่มทำงาน และการตรวจอัตโนมัติผ่าน</text><rect x="1215.0" y="206.0" width="325.0" height="46.0" fill="#16726D" rx="23"/><text x="1377.5" y="230.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">พิสูจน์แล้ว</text><text x="78.0" y="302.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">การส่งคำขอยืม ผ่านหน้าจอจริง</text><text x="520.0" y="302.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">ชุดทดสอบผ่านเบราว์เซอร์ บนฐานข้อมูลที่ตั้งใหม่ ผ่านในวันรายงาน</text><rect x="1215.0" y="272.0" width="325.0" height="46.0" fill="#16726D" rx="23"/><text x="1377.5" y="296.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">พิสูจน์แล้ว</text><rect x="60.0" y="328.0" width="1480.0" height="66.0" fill="#F2F7F7"/><text x="78.0" y="368.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">การจัดการผู้ใช้ และการจัดการอุปกรณ์</text><text x="520.0" y="368.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">ชุดทดสอบฝั่ง Back-End และชุดผ่านเบราว์เซอร์ ครอบคลุมทั้งสองเรื่อง</text><rect x="1215.0" y="338.0" width="325.0" height="46.0" fill="#16726D" rx="23"/><text x="1377.5" y="362.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">พิสูจน์แล้ว</text><text x="78.0" y="434.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">ยืนยันตัวตน เซสชัน และบันทึกการตรวจสอบ</text><text x="520.0" y="434.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">ชุดทดสอบทำงานบนฐานข้อมูลจริง ในระบบตรวจอัตโนมัติ</text><rect x="1215.0" y="404.0" width="325.0" height="46.0" fill="#16726D" rx="23"/><text x="1377.5" y="428.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">พิสูจน์แล้ว</text><rect x="60.0" y="460.0" width="1480.0" height="66.0" fill="#F2F7F7"/><text x="78.0" y="500.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">วงจรยืม–คืน ขั้นอนุมัติ ถึงตรวจสภาพ</text><text x="520.0" y="500.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">ชุดทดสอบฝั่ง Back-End ครอบคลุมครบ แต่ยังไม่มีชุดที่เดินผ่านหน้าจอ</text><rect x="1215.0" y="470.0" width="325.0" height="46.0" fill="#DAE8E8" rx="23"/><text x="1377.5" y="494.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#16726D" font-weight="700" text-anchor="middle">พิสูจน์แล้ว แต่ไม่อัตโนมัติ</text><text x="78.0" y="566.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">กฎธุรกิจฝั่ง Front-End</text><text x="520.0" y="566.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">ชุดตรวจเกณฑ์การยอมรับ 49 ข้อ ผ่านทั้งหมด ต้องสั่งรันเอง</text><rect x="1215.0" y="536.0" width="325.0" height="46.0" fill="#DAE8E8" rx="23"/><text x="1377.5" y="560.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#16726D" font-weight="700" text-anchor="middle">พิสูจน์แล้ว แต่ไม่อัตโนมัติ</text><rect x="60.0" y="592.0" width="1480.0" height="66.0" fill="#F2F7F7"/><text x="78.0" y="632.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">หน้ารับของ และการแนบรูป</text><text x="520.0" y="632.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">เรียกคำสั่งที่เซิร์ฟเวอร์ไม่มี ตรวจชนิดข้อมูลผ่านเพราะสัญญาเขียนด้วยมือ</text><rect x="1215.0" y="602.0" width="325.0" height="46.0" fill="#F5EAE2" rx="23"/><text x="1377.5" y="626.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#AD4E0C" font-weight="700" text-anchor="middle">เขียนเสร็จ ยังไม่พิสูจน์</text><text x="78.0" y="698.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18.5" fill="#13211F" font-weight="700">การต่ออายุ งานตามเวลา และรายงาน</text><text x="520.0" y="698.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="17.5" fill="#13211F">ไม่มีชุดทดสอบ เท่ารอบก่อน</text><rect x="1215.0" y="668.0" width="325.0" height="46.0" fill="#F5EAE2" rx="23"/><text x="1377.5" y="692.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="16.5" fill="#AD4E0C" font-weight="700" text-anchor="middle">เขียนเสร็จ ยังไม่พิสูจน์</text><rect x="60.0" y="744.0" width="1480.0" height="88.0" fill="#FAF4F0" rx="10"/><rect x="60.0" y="744.0" width="5.0" height="88.0" fill="#AD4E0C" rx="2.5"/><text x="84.0" y="776.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#13211F" xml:space="preserve"><tspan font-weight="700">อ่านตัวเลข 79% อย่างไร — </tspan><tspan>ตัวเลขนี้วัดปริมาณงานที่เขียนเสร็จ ไม่ได้วัดว่าผู้ใช้ทำงานจริงได้เท่าไร แถวที่ขยับขึ้นจากรอบก่อน คือการส่งคำขอยืม ซึ่งรอบก่อนผู้ยืมยังทำไม่ได้เลย ส่วนที่ยังค้าง</tspan></text><text x="84.0" y="803.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="18" fill="#13211F" xml:space="preserve"><tspan>คือไม่มีชุดทดสอบใด เดินวงจรยืม–คืนครบเส้นทางผ่านหน้าจอ</tspan></text></svg>