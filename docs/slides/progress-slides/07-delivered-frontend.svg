<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><circle cx="-40" cy="980" r="330" fill="#F2F7F7"/><circle cx="1670" cy="940" r="200" fill="#F2F7F7"/><rect x="0.0" y="0.0" width="1600.0" height="118.0" fill="#16726D"/><text x="60.0" y="62.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="40" fill="#FFFFFF" font-weight="700" letter-spacing="1.4">FRONT-END</text><text x="60.0" y="96.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="21" fill="#FFFFFF" opacity="0.86">ผลงานที่ส่งมอบแล้ว — ฝั่ง Front-End</text><text x="1450.0" y="66.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19" fill="#FFFFFF" text-anchor="end" opacity="0.8">หัวข้อที่</text><circle cx="1506" cy="59.0" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/><text x="1506.0" y="70.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text><line x1="60" y1="840" x2="1540" y2="840" stroke="#DCE7E5" stroke-width="1.5"/><text x="60.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#7E8F8D">ULMs รายงานความก้าวหน้าโครงการ ครั้งที่ 1</text><text x="1540.0" y="868.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="15" fill="#16726D" font-weight="700" text-anchor="end">07</text><circle cx="68.0" cy="171.0" r="4.5" fill="#16726D"/><text x="88.0" y="178.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">โครงสร้างพื้นฐาน </tspan><tspan>Vite + React 18 + TypeScript + React Router มีเส้นทางหน้าจอ 30 เส้นทาง พร้อมชั้นคุ้มกันสิทธิ์ตามบทบาท 4 กลุ่ม และโหลดหน้าจอแบบแยกก้อนทุกหน้า</tspan></text><circle cx="68.0" cy="262.3" r="4.5" fill="#16726D"/><text x="88.0" y="269.3" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ระบบออกแบบ </tspan><tspan>Tailwind CSS พร้อมโทเคนสี และส่วนประกอบพื้นฐานที่ใช้ซ้ำได้ รวมตารางข้อมูล กราฟ กล่องโต้ตอบ และแผงเลื่อน รองรับไทย–อังกฤษ และโหมดสว่าง–มืด</tspan></text><circle cx="68.0" cy="353.7" r="4.5" fill="#16726D"/><text x="88.0" y="360.7" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">หน้าจอที่มีเนื้อหาจริง 14 จาก 30 หน้า </tspan><tspan>ผู้ดูแลระบบ 6 หน้า (ผู้ใช้ บันทึกการตรวจสอบ แผงสรุป สถานะระบบ ตั้งค่าระบบ รายงาน) ผู้ยืม 6 หน้า (รายการอุปกรณ์ รายละเอียดอุปกรณ์</tspan></text><text x="88.0" y="388.7" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan>รายการยืมของฉัน สร้างคำขอยืม รายการห้องและจองห้อง ซึ่งเป็นจุดตั้งต้นของงาน T3) โปรไฟล์ผู้ใช้ และเข้าสู่ระบบ</tspan></text><circle cx="68.0" cy="473.0" r="4.5" fill="#16726D"/><text x="88.0" y="480.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">เส้นทางแรกที่อ่านข้อมูลจริง </tspan><tspan>หน้าเข้าสู่ระบบส่งรหัสผ่าน ไปตรวจที่ฐานข้อมูลจริง เมื่อเปิดเว็บ ระบบจะถามฝั่ง Back-End ว่าผู้ใช้คนปัจจุบันเป็นใคร แล้วแสดงชื่อกับบทบาทที่ได้</tspan></text><text x="88.0" y="508.0" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan>และปุ่มออกจากระบบ ลบเซสชันที่ฝั่ง Back-End จริง</tspan></text><circle cx="68.0" cy="592.3" r="4.5" fill="#16726D"/><text x="88.0" y="599.3" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ไลบรารีตรวจสอบข้อมูล ตรงรุ่นกับฝั่ง Back-End แล้ว </tspan><tspan>เป็นเงื่อนไขที่ปิดกั้นการรับไฟล์สัญญา มาตั้งแต่ Sprint 1 เมื่อตรงรุ่นแล้ว การรับไฟล์สัญญา</tspan></text><text x="88.0" y="627.3" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan>จึงเหลือเพียงขั้นตอนเปลี่ยนที่มาของชนิดข้อมูล</tspan></text><circle cx="68.0" cy="711.7" r="4.5" fill="#16726D"/><text x="88.0" y="718.7" font-family="Laksaman, Noto Sans Thai, sans-serif" font-size="19.5" fill="#13211F" xml:space="preserve"><tspan font-weight="700">ไลบรารีกฎธุรกิจ </tspan><tspan>ครอบคลุมช่วงเวลายืม เวลาตัดคืน 17:00 น. การนับช่องจองพร้อมกันของ T3 การตรวจไฟล์อัปโหลด และข้อความแสดงข้อผิดพลาด พร้อมสคริปต์ตรวจเกณฑ์การยอมรับ</tspan></text></svg>