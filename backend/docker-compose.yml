# LOCAL DEVELOPMENT ONLY.
# Default passwords below are safe for laptop use only.
# Deploy environments MUST set POSTGRES_PASSWORD via environment.
# Production uses ../docker-compose.prod.yml instead.

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dev mail catcher. Nothing leaves the laptop: SMTP on 1025, web UI on 8025.
  # Password-reset links are read out of the UI rather than a real inbox.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
