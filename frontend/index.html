<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ULMs · ระบบยืม–คืนอุปกรณ์มหาวิทยาลัย</title>
    <meta name="description" content="ระบบบริหารจัดการการยืม–คืนอุปกรณ์มหาวิทยาลัย" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the saved theme synchronously, before React paints, so there is
      // no flash of light mode on load (esp. the green login panel). Mirrors
      // getInitialTheme() in src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("ulms-theme");
          var dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.body.classList.add("dark");
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
